<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#333333"><meta name="apple-mobile-web-app-capable" content="yes"><title>November Strength</title><style>
:root{font-family:system-ui,sans-serif;color:#182b27;background:#f3f5ef}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:32px 20px 60px}header{display:flex;justify-content:space-between;align-items:start;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:#557068;font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0}p{color:#60716b;line-height:1.5}#status{font-size:12px;background:#e1eadc;border-radius:20px;padding:8px 12px;white-space:nowrap}nav{display:flex;gap:8px;margin:24px 0 12px}button{font:inherit;cursor:pointer;border:1px solid #d7dfd3;background:transparent;color:#334c42;border-radius:10px;padding:12px 16px}button[aria-selected=true]{background:#214f3b;color:white;border-color:#214f3b}#weeks button{flex:1;padding:12px 4px}#days{flex-wrap:wrap;margin-top:12px}#days button{flex:1;font-size:14px}.note{font-size:13px;border-left:3px solid #a5b896;padding:8px 14px;background:#eaf0e3;border-radius:0 8px 8px 0;margin:16px 0 24px}h2{font-size:24px;margin:24px 0 4px}.sub{margin:0 0 20px;font-size:14px}.exercise{background:white;border:1px solid #e0e6da;border-radius:14px;padding:20px;margin-bottom:12px}.title{display:flex;align-items:baseline;gap:12px}.num{color:#8a9d8d;font-size:13px}h3{font-size:17px;margin:0}.target{font-size:13px;color:#63786d;margin:6px 0 14px 27px}.grid{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;align-items:center;max-width:470px;margin-left:27px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#738479}.set{font-size:13px;color:#718075}input{width:100%;min-width:0;border:1px solid #d9e2d5;border-radius:8px;background:#f9faf7;padding:10px 12px;color:#183b2b;font:inherit;font-variant-numeric:tabular-nums}input:focus{outline:2px solid #64936b;outline-offset:1px}summary{cursor:pointer;font-size:14px;color:#3d5e48}details{padding:16px 0}details p{font-size:14px}footer{font-size:12px;color:#78867d;margin-top:22px}@media(max-width:500px){main{padding:24px 14px}h1{font-size:32px}header{display:block}#status{display:inline-block;margin-top:6px}.exercise{padding:16px 12px}.grid{margin-left:0}.target{margin-left:27px}#days button{padding:11px 5px;font-size:12px}}

:root{color:#fff;background:#333;font-family:'Segoe UI',system-ui,sans-serif}main{max-width:620px;padding:24px 16px 40px}header{display:block}h1{font-weight:300;letter-spacing:-1px;font-size:38px}.eyebrow{color:#ffda44}p,.sub{color:#ddd}#status{display:inline-block;margin:14px 0 0;background:#424242;color:#eee;border-radius:0}nav{gap:6px}button{border:0;border-radius:0;background:#454545;color:white;min-height:48px}button[aria-selected=true]{background:#0878c9;border:0}#weeks button{font-size:14px}#days button{text-align:left;background:#414141;border-bottom:4px solid transparent;font-size:13px;min-height:72px}#days button[aria-selected=true]{background:#ffda44;color:#222;border-color:#ffda44}.note{border:0;border-radius:0;background:#3e3e3e;color:#eee;padding:14px;line-height:1.5}h2{font-weight:400}.exercise{border:0;border-radius:0;background:#292929;padding:18px;margin-bottom:8px;border-left:4px solid #0878c9}.num{background:#0878c9;color:#fff;padding:5px 8px}.title{align-items:center;gap:10px}h3{font-weight:500}.target{color:#c7c7c7;margin-left:0;margin-top:12px}.grid{margin-left:0;max-width:none;grid-template-columns:42px 1fr 1fr;gap:8px}.label,.set{color:#ccc}input{background:#3d3d3d;border:1px solid #686868;border-radius:0;color:white;min-height:48px;font-size:17px}input:disabled{opacity:1;background:#333;color:#ddd;border-color:#484848}input:focus{outline:2px solid #ffda44;outline-offset:0}summary{color:#ffda44}footer{color:#bbb;line-height:1.6}.submit{width:100%;background:#0878c9;color:white;text-align:left;font-size:18px;padding:18px;margin-top:10px}.submit.edit{background:#ffda44;color:#222}.day-status{font-size:14px;color:#ffda44;margin:0 0 10px}.day-status:empty{display:none}.day-hint{font-size:12px;color:#ccc;margin-top:10px}.submit:focus-visible,button:focus-visible{outline:2px solid #ffda44;outline-offset:2px}@media(max-width:500px){main{padding:22px 12px 36px}.exercise{padding:16px 12px}h1{font-size:34px}#days button{font-size:12px;padding:10px 7px}.target{margin-left:0}}
.note:empty{display:none}.day-hint:empty{display:none}
.celebration{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#111b;pointer-events:none}.celebration[hidden]{display:none}.prize{position:relative;text-align:center;background:#333;padding:34px 46px;border-bottom:6px solid #ffda44;box-shadow:0 20px 90px #0008;animation:prize-in .65s cubic-bezier(.2,1.6,.4,1) both}.trophy{font-size:92px;line-height:1.3;display:block;animation:trophy-dance 1.1s .55s ease-in-out}.prize strong{display:block;color:#ffda44;font-size:28px;font-weight:600}.prize p{margin:8px 0 0;color:white;font-size:17px}.confetti{position:absolute;top:-20px;width:10px;height:16px;animation:confetti-fall 2.6s ease-in both}@keyframes prize-in{from{opacity:0;transform:translateY(35px) scale(.5)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes trophy-dance{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.15)}60%{transform:rotate(12deg) scale(1.15)}}@keyframes confetti-fall{0%{transform:translateY(-5vh) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(650deg);opacity:0}}@media(prefers-reduced-motion:reduce){.prize,.trophy{animation:none}.confetti{display:none}}
</style></head><body><main><header><div><div class="eyebrow">November 2026 · 3 days / week</div><h1>Your training.</h1></div><span id="status" role="status">Ready</span></header><nav id="weeks" role="tablist" aria-label="Training week"></nav><p id="dates" class="sub"></p><nav id="days" role="tablist" aria-label="Workout"></nav><div class="note" id="weekNote"></div><h2 id="heading"></h2><p id="dayStatus" class="day-status" role="status"></p><section id="exercises" aria-label="Exercise log"></section><button type="button" id="submitDay" class="submit"></button><p class="day-hint" id="dayHint"></p></main><div id="celebration" class="celebration" hidden role="status" aria-live="polite"><div class="prize"><span class="trophy" aria-hidden="true">🏆</span><strong>Day complete!</strong><p>You showed up. You did it.</p></div></div><script>
const KEY='november-strength-2026-v1';
const program=[{name:'Chest + biceps',short:'Chest + biceps',ex:[['Bench press',3,'8–10',70],['Incline dumbbell press',3,'8–12',null],['Chest press machine',2,'10–12',null],['Barbell curl',3,'8–10',35],['Incline dumbbell curl',3,'10–12',null]]},{name:'Back + triceps + delts',short:'Back + triceps',ex:[['Bent-over barbell row',3,'8–10',75],['Lat pulldown',3,'8–10',123],['Face pull',3,'12–15',null],['Cable triceps pressdown',3,'10–12',null],['EZ-bar skull crushers',2,'10–12',null],['Dumbbell lateral raises',3,'12–15',null]]},{name:'Legs + chest / biceps',short:'Legs + top-up',ex:[['Squat',3,'8–10',70],['Romanian deadlift',3,'8–10',90],['Leg press',3,'10–12',120],['Incline dumbbell press',3,'8–12',null],['Hammer curl',3,'10–12',null]]}];
let state={week:0,day:0,entries:{},submitted:{},autoEasy:{}};let editing=false;let storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.entries&&typeof s.entries==='object'){state.entries=s.entries;state.autoEasy=s.autoEasy&&typeof s.autoEasy==='object'?s.autoEasy:{};state.submitted=s.submitted&&typeof s.submitted==='object'?s.submitted:{};state.week=Number.isInteger(s.week)&&s.week>=0&&s.week<4?s.week:0;state.day=Number.isInteger(s.day)&&s.day>=0&&s.day<3?s.day:0}}catch(e){storageOK=false}
const status=document.getElementById('status');status.textContent=storageOK?'Saved':'Storage unavailable';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));status.textContent='Saved';return true}catch(e){status.textContent='Not saved — browser storage unavailable';return false}}
function fieldKey(e,s,f){return [state.week,state.day,e,s,f].join('-')}
function tabs(id,items,selected,change){const el=document.getElementById(id);el.replaceChildren();items.forEach((text,i)=>{const b=document.createElement('button');b.textContent=text;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',i===selected);b.onclick=()=>{editing=false;change(i);save();render()};b.onkeydown=ev=>{if(['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();const next=(i+(ev.key==='ArrowRight'?1:-1)+items.length)%items.length;editing=false;change(next);save();render();document.getElementById(id).children[next].focus()}};el.append(b)})}
function setCount(ex){return state.week===3?2:ex[1]}
let celebrationTimer;
function celebrate(){const layer=document.getElementById('celebration');clearTimeout(celebrationTimer);layer.querySelectorAll('.confetti').forEach(c=>c.remove());for(let i=0;i<36;i++){const piece=document.createElement('span');piece.className='confetti';piece.setAttribute('aria-hidden','true');piece.style.left=(Math.random()*100)+'%';piece.style.background=['#ffda44','#0799ff','#fff'][i%3];piece.style.animationDelay=(Math.random()*.45)+'s';layer.append(piece)}layer.hidden=false;celebrationTimer=setTimeout(()=>{layer.hidden=true;layer.querySelectorAll('.confetti').forEach(c=>c.remove())},3300)}
function dayKey(){return state.week+'-'+state.day}
function renderSubmit(){const done=!!state.submitted[dayKey()];const button=document.getElementById('submitDay');button.textContent=done&&!editing?'✎  Edit day':done?'✓  Save corrections':'✓  Submit day';button.classList.toggle('edit',done&&!editing);document.getElementById('dayStatus').textContent=done?(editing?'Editing submitted day':'✓ Day submitted'):'';document.getElementById('dayHint').textContent='';button.onclick=()=>{if(done&&!editing){editing=true;render();return}const inputs=[...document.querySelectorAll('#exercises input')];const missing=inputs.filter(i=>i.value===''||!i.validity.valid||Number(i.value)<=0);inputs.forEach(i=>{i.style.borderColor='';i.removeAttribute('aria-invalid')});if(missing.length){missing.forEach(i=>{i.style.borderColor='#ffda44';i.setAttribute('aria-invalid','true')});document.getElementById('dayStatus').textContent='Complete every set: '+missing.length+' missing or invalid field(s).';missing[0].focus();return}const old=state.submitted[dayKey()];state.submitted[dayKey()]=true;if(state.week===2&&!state.submitted['3-'+state.day]){program[state.day].ex.forEach((ex,e)=>{for(let set=0;set<2;set++){const target=['3',state.day,e,set,'kg'].join('-');const source=['2',state.day,e,set,'kg'].join('-');if(!Object.hasOwn(state.entries,target)||state.autoEasy[target]){state.autoEasy[target]=true;state.entries[target]=String(Math.round(Number(state.entries[source])*0.85*2)/2)}}})}if(save()){editing=false;render();if(!old)celebrate()}else{if(old)state.submitted[dayKey()]=old;else delete state.submitted[dayKey()];document.getElementById('dayStatus').textContent='Could not submit. Browser storage is unavailable.'}}}
function render(){tabs('weeks',['Week 1','Week 2','Week 3','Week 4 · Easy'].map((label,w)=>label+(program.every((_,d)=>state.submitted[w+'-'+d])?' ✓':'')),state.week,i=>state.week=i);tabs('days',program.map((d,i)=>d.short+(state.submitted[state.week+'-'+i]?' ✓':'')),state.day,i=>state.day=i);document.getElementById('dates').textContent=['2–8 November','9–15 November','16–22 November','23–29 November'][state.week];document.getElementById('weekNote').textContent=['','','','Easy week · 2 sets · −15% weight'][state.week];document.getElementById('heading').textContent=program[state.day].name;const list=document.getElementById('exercises');list.replaceChildren();program[state.day].ex.forEach((ex,e)=>{const card=document.createElement('article');card.className='exercise';card.innerHTML=`<div class="title"><span class="num">${String(e+1).padStart(2,'0')}</span><h3>${ex[0]}</h3></div><p class="target">${setCount(ex)} sets × ${ex[2]} reps${ex[0]==='Lat pulldown'?' · Your usual machine':''}</p><div class="grid"><span></span><span class="label">Weight · kg</span><span class="label">Reps done</span></div>`;const grid=card.querySelector('.grid');for(let s=0;s<setCount(ex);s++){const label=document.createElement('span');label.className='set';label.textContent='Set '+(s+1);grid.append(label);for(const f of ['kg','reps']){const input=document.createElement('input');input.type='number';input.min='0';input.step=f==='kg'?'0.5':'1';input.inputMode=f==='kg'?'decimal':'numeric';const key=fieldKey(e,s,f);input.value=Object.hasOwn(state.entries,key)?state.entries[key]:f==='kg'?(state.week===3?'':(ex[3]??'')):'';input.placeholder=f==='kg'?'Enter kg':'Enter reps';input.disabled=!!state.submitted[dayKey()]&&!editing;input.setAttribute('aria-label',`${ex[0]}, set ${s+1}, ${f==='kg'?'weight in kilograms':'reps done'}`);input.oninput=()=>{if(!input.validity.valid){status.textContent='Use a valid non-negative number';return}state.entries[key]=input.value;delete state.autoEasy[key];save()};grid.append(input)}}list.append(card)});renderSubmit()}render();
</script></body></html>
